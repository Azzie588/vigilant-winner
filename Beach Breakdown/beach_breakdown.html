      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *

        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-map"><path d="M14.106 5.553a2 2 0 0 0-1.788 0l-3.648 1.824a2 2 0 0 1-1.788 0L3 5.429V18.57l3.658 1.829a2 2 0 0 0 1.788 0l3.648-1.824a2 2 0 0 1 1.788 0L21 20.571V7.429z"/><path d="M15 5.764v14"/><path d="M9 3.236v14"/></svg>
      );
    }

    // --- 1. MapView Modal Component ---
    function MapView({ activeTab, activities, restaurants, home, onClose, onSelectRestaurant }) {
      const mapContainerRef = useRef(null);
      const mapRef = useRef(null);
      const markersRef = useRef([]);
      const homeMarkerRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current) return;
        
        const map = L.map(mapContainerRef.current).setView([home.lat, home.lng], 14);
        mapRef.current = map;

        L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          maxZoom: 20,
        }).addTo(map);

        return () => {
          map.remove();
          mapRef.current = null;
        };
      }, []);

      // Update Home Base
      useEffect(() => {
        const map = mapRef.current;
        if (!map) return;

        if (homeMarkerRef.current) map.removeLayer(homeMarkerRef.current);

        const homeIcon = L.divIcon({
          html: '<div class="flex items-center justify-center w-9 h-9 rounded-full bg-[#f4a261] border-2 border-white shadow-lg text-base text-white transform -translate-x-1/2 -translate-y-1/2">🏠</div>',
          className: "",
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        homeMarkerRef.current = L.marker([home.lat, home.lng], { icon: homeIcon })
          .addTo(map)
          .bindPopup(`<div class="p-1 font-sans text-xs"><b>Home Base:</b><br>${home.name}</div>`);

        map.setView([home.lat, home.lng], 14);
      }, [home]);

      // Update Markers
      useEffect(() => {
        const map = mapRef.current;
        if (!map) return;

        markersRef.current.forEach(m => map.removeLayer(m));
        markersRef.current = [];

        const list = activeTab === "activities" ? activities : restaurants;
        const bounds = [[home.lat, home.lng]];

        list.forEach(item => {
          if (item.lat === null || item.lng === null) return;
          bounds.push([item.lat, item.lng]);

          const color = activeTab === "restaurants" ? "#0096a0" : "#725ac1";
          const icon = activeTab === "restaurants" ? "🍔" : "🎡";

          const pinIcon = L.divIcon({
            html: `<div class="flex items-center justify-center w-7 h-7 rounded-full shadow bg-white border-2 text-xs" style="border-color: ${color}; transform: translate(-50%, -50%);">${icon}</div>`,
            className: "",
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker([item.lat, item.lng], { icon: pinIcon }).addTo(map);

          let popup = `<div class="p-2 font-sans min-w-[180px]">`;
          if (activeTab === "restaurants") {
            popup += `
              <b class="text-[#1b3a4b]">${item.restaurant}</b><br>
              <span class="text-xs text-gray-500">${item.address}</span><br>
              <span class="text-xs text-[#0077b6]"><b>${item.distanceCategory}</b></span><br>
              ${item.menu ? `<button id="map-menu-btn-${item.id}" class="w-full mt-2 text-[10px] font-bold text-white bg-[#0096a0] py-1 rounded-full">Menu</button>` : ""}
            `;
          } else {
            popup += `
              <b class="text-[#1b3a4b]">${item.name}</b><br>
              <span class="text-xs text-gray-500">${item.address}</span><br>
              <span class="text-xs text-[#725ac1]"><b>${item.category}</b></span>
            `;
          }
          popup += `</div>`;

          marker.bindPopup(popup);

          marker.on("popupopen", () => {
            if (activeTab === "restaurants" && onSelectRestaurant) {
              const btn = document.getElementById(`map-menu-btn-${item.id}`);
              if (btn) btn.onclick = () => onSelectRestaurant(item);
            }
          });

          markersRef.current.push(marker);
        });

        if (bounds.length > 1) {
          map.fitBounds(bounds, { padding: [40, 40] });
        }
      }, [activities, restaurants, activeTab, home]);

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
          <div className="relative w-full max-w-4xl h-[85vh] bg-[#fef9ec] rounded-3xl overflow-hidden shadow-2xl flex flex-col border border-[rgba(0,150,160,0.2)]">
            <div className="flex items-center justify-between px-6 py-4 bg-[#1b3a4b] text-white">
              <div className="flex items-center gap-2">
                <span className="text-xl">🗺️</span>
                <div>
                  <h2 className="text-lg font-heading font-bold">OC Map Guide</h2>
                  <p className="text-xs text-white/70">Showing {activeTab === "activities" ? activities.length : restaurants.length} pins</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10 text-white/80 hover:text-white"><IconX /></button>
            </div>
            <div className="flex-1 w-full h-full relative">
              <div ref={mapContainerRef} className="absolute inset-0 w-full h-full" style={{zIndex: 10}} />
            </div>
          </div>
        </div>
      );
    }

    // --- 2. MenuModal Overlay Component ---
    function MenuModal({ menuUrl, restaurantName, onClose }) {
      const isExternal = menuUrl.startsWith("http://") || menuUrl.startsWith("https://");
      const [zoom, setZoom] = useState(1);
      const finalUrl = isExternal ? menuUrl : `menus/${menuUrl}`;

      return (
        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
          <div className="relative w-full max-w-3xl h-[85vh] bg-[#fef9ec] rounded-3xl overflow-hidden shadow-2xl flex flex-col border border-[rgba(0,150,160,0.2)]">
            <div className="flex items-center justify-between px-6 py-4 bg-[#1b3a4b] text-white">
              <div>
                <p className="text-[10px] font-bold uppercase tracking-wider text-[#f4a261]">Restaurant Menu</p>
                <h2 className="text-xl font-heading font-bold leading-tight">{restaurantName}</h2>
              </div>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10 text-white/80 hover:text-white"><IconX /></button>
            </div>
            
            <div className="flex-1 bg-[#1b2a32] flex flex-col items-center justify-center p-6 overflow-hidden relative">
              {isExternal ? (
                <div className="max-w-sm text-center p-6 bg-white rounded-3xl border border-[rgba(0,150,160,0.2)] shadow-xl">
                  <div className="text-3xl mb-3">🌐</div>
                  <h3 className="text-lg font-bold text-[#1b3a4b] mb-1 font-heading">Menu Web Link</h3>
                  <p className="text-xs text-[#5e7e8a] mb-5 leading-relaxed">
                    Browser security blocks embedding external websites. Click below to open this menu in a new browser tab.
                  </p>
                  <a href={menuUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-1.5 w-full text-sm font-bold text-white bg-[#0096a0] hover:bg-[#007b85] py-3 px-5 rounded-full transition-all">
                    Open Menu Website <IconExternal />
                  </a>
                </div>
              ) : (
                <div className="w-full h-full flex flex-col items-center justify-center relative">
                  <div className="absolute top-2 right-2 z-20 flex gap-1 bg-[#1b3a4b]/80 backdrop-blur p-1 rounded-full shadow">
                    <button onClick={() => setZoom(z => Math.min(3, z+0.25))} className="px-2 py-1 text-white text-xs font-bold font-mono hover:bg-white/10 rounded-full">Zoom+</button>
                    <button onClick={() => setZoom(z => Math.max(0.5, z-0.25))} className="px-2 py-1 text-white text-xs font-bold font-mono hover:bg-white/10 rounded-full">Zoom-</button>
                    <button onClick={() => setZoom(1)} className="px-2 py-1 text-white text-xs font-bold font-mono hover:bg-white/10 rounded-full">Reset</button>
                  </div>
                  <div className="w-full h-full overflow-auto flex items-center justify-center p-2">
                    <img 
                      src={finalUrl} 
                      alt="Menu" 
                      className="max-w-none transition-transform duration-200" 
                      style={{ transform: `scale(${zoom})`, maxHeight: "90%", maxWidth: "90%" }}
                      onError={(e) => {
                        e.target.style.display = 'none';
                        const p = e.target.parentElement;
                        const err = document.createElement("div");
                        err.className = "text-center text-white p-4";
                        err.innerHTML = `
                          <div class="text-3xl mb-1">⚠️</div>
                          <h4 class="font-bold text-sm">Menu File Offline</h4>
                          <p class="text-[11px] text-white/50 mt-1">Copy "${menuUrl}" into a folder named "menus" next to this HTML file to view offline.</p>
                        `;
                        p.appendChild(err);
                      }}
                    />
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- 3. EasyRead Cards Component ---
    function EasyRead({ activeTab, activities, restaurants, onOpenMenu, onOpenMap }) {
      const isRestaurants = activeTab === "restaurants";

      return (
        <div className="max-w-xl mx-auto flex flex-col gap-5 py-4">
          {isRestaurants ? (
            restaurants.length === 0 ? (
              <div className="text-center py-12 text-[#5e7e8a] font-bold bg-[#fffef7] rounded-3xl border border-dashed border-[#0096a0]/20">🏖️ No restaurants match filters.</div>
            ) : (
              restaurants.map(r => {
                const displayDist = r.calculatedDistance !== undefined ? formatDistance(r.calculatedDistance) : r.distance;
                return (
                  <div key={r.id} className="bg-[#fffef7] rounded-3xl border-2 border-[rgba(0,150,160,0.18)] shadow-sm overflow-hidden p-5 sm:p-6">
                    <div className="flex justify-between items-start mb-2">
                      <h2 className="text-2xl font-bold font-heading text-[#1b3a4b] leading-tight">{r.restaurant}</h2>
                      <span className="text-xs font-black px-2 py-0.5 rounded-full bg-[#d4eeef] text-[#0096a0] border border-[#0096a0]/20">{r.filterLevel || r.level}</span>
                    </div>
                    {r.generalType && <p className="text-base text-[#0077b6] font-extrabold mb-4">🍕 {r.generalType}</p>}
                    
                    <div className="flex flex-col gap-3.5 mb-5 text-[#1b3a4b]">
                      <div>
                        <p className="text-[10px] font-bold uppercase tracking-wider text-[#5e7e8a]">Location</p>
                        <p className="text-base font-bold">{r.address}</p>
                        <p className="text-base text-[#0077b6] font-black mt-0.5">📍 {displayDist} away ({r.distanceCategory})</p>
                      </div>
                      {r.hours && (
                        <div>
                          <p className="text-[10px] font-bold uppercase tracking-wider text-[#5e7e8a]">Hours</p>
                          <p className="text-base font-bold">{r.hours}</p>
                        </div>
                      )}
                      {r.notes && (
                        <div className="bg-[#fef9ec] border border-[rgba(0,150,160,0.1)] rounded-xl p-3">
                          <p className="text-[10px] font-bold uppercase tracking-wider text-[#5e7e8a] mb-0.5">Good to Know</p>
                          <p className="text-sm font-semibold leading-relaxed">{r.notes}</p>
                        </div>
                      )}
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      {r.menu ? (
                        <button onClick={() => onOpenMenu(r.menu, r.restaurant)} className="text-xs font-black text-white bg-[#0096a0] hover:bg-[#007b85] py-3 rounded-xl shadow-sm">Menu</button>
                      ) : (
                        <button disabled className="text-xs font-bold text-gray-300 bg-gray-100 py-3 rounded-xl cursor-not-allowed">No Menu</button>
                      )}
                      {r.websiteUrl ? (
                        <a href={r.websiteUrl} target="_blank" rel="noopener noreferrer" className="text-xs font-black text-[#0096a0] border-2 border-[#0096a0] bg-white text-center py-2.5 rounded-xl hover:bg-[#d4eeef]/20">Website</a>
                      ) : (
                        <span className="text-xs font-bold text-gray-300 bg-gray-100 text-center py-2.5 rounded-xl">No Web</span>
                      )}
                      <button onClick={onOpenMap} className="text-xs font-black text-[#1b3a4b] bg-[#fdefc8] border border-[#f4a261]/30 py-3 rounded-xl hover:bg-[#fdefc8]/85">🗺️ Map</button>
                    </div>
                  </div>
                );
              })
            )
          ) : (
            activities.length === 0 ? (
              <div className="text-center py-12 text-[#5e7e8a] font-bold bg-[#fffef7] rounded-3xl border border-dashed border-[#725ac1]/20">🏖️ No activities match filters.</div>
            ) : (
              activities.map(a => {
                const displayDist = a.calculatedDistance !== undefined ? formatDistance(a.calculatedDistance) : a.distance;
                return (
                  <div key={a.id} className="bg-[#fffef7] rounded-3xl border-2 border-[rgba(114,90,193,0.18)] shadow-sm overflow-hidden p-5 sm:p-6">
                    <div className="flex justify-between items-start mb-2">
                      <h2 className="text-2xl font-bold font-heading text-[#1b3a4b] leading-tight">{a.name}</h2>
                      <span className="text-xs font-black px-2 py-0.5 rounded-full bg-[#725ac1]/10 text-[#725ac1] border border-[#725ac1]/20">{a.category}</span>
                    </div>
                    {a.what && <p className="text-base text-[#725ac1] font-extrabold mb-4">🎡 {a.what}</p>}
                    
                    <div className="flex flex-col gap-3.5 mb-5 text-[#1b3a4b]">
                      <div>
                        <p className="text-[10px] font-bold uppercase tracking-wider text-[#5e7e8a]">Location</p>
                        <p className="text-base font-bold">{a.address}</p>
                        <p className="text-base text-[#725ac1] font-black mt-0.5">📍 {displayDist} away</p>
                      </div>
                      {a.transitDetail && (
                        <div>
                          <p className="text-[10px] font-bold uppercase tracking-wider text-[#5e7e8a]">Getting There</p>
                          <p className="text-base font-bold">🚌 {a.transitDetail}</p>
                        </div>
                      )}
                      {a.hours && (
                        <div>
                          <p className="text-[10px] font-bold uppercase tracking-wider text-[#5e7e8a]">Hours</p>
                          <p className="text-base font-bold">{a.hours}</p>
                        </div>
                      )}
                      {a.notes && (
                        <div className="bg-[#fef9ec] border border-[rgba(114,90,193,0.1)] rounded-xl p-3">
                          <p className="text-[10px] font-bold uppercase tracking-wider text-[#5e7e8a]">Good to Know</p>
                          <p className="text-sm font-semibold leading-relaxed">{a.notes}</p>
                        </div>
                      )}
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      {a.url ? (
                        <a href={a.url} target="_blank" rel="noopener noreferrer" className="text-xs font-black text-white bg-[#725ac1] text-center py-3 rounded-xl hover:bg-[#5b46a1]">Website</a>
                      ) : (
                        <span className="text-xs font-bold text-gray-300 bg-gray-100 text-center py-3 rounded-xl">No Web</span>
                      )}
                      <button onClick={onOpenMap} className="text-xs font-black text-[#1b3a4b] bg-[#fdefc8] border border-[#f4a261]/30 py-3 rounded-xl hover:bg-[#fdefc8]/85">🗺️ Map</button>
                    </div>
                  </div>
                );
              })
            )
          )}
        </div>
      );
    }

    // --- 4. Main App Controller Component ---
    function App() {
      const [activeTab, setActiveTab] = useState("activities");
      const [viewMode, setViewMode] = useState("table");
      const [isMapOpen, setIsMapOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [activeMenu, setActiveMenu] = useState(null);

      // Home coordinates state (defaults to 94th & Caribbean)
      const [homeLocation, setHomeLocation] = useState({
        name: "94th & Caribbean Drive",
        lat: 38.4095184,
        lng: -75.0617443
      });

      // Custom coordinates forms
      const [customName, setCustomName] = useState("Custom Location");
      const [customLat, setCustomLat] = useState("38.4095184");
      const [customLng, setCustomLng] = useState("-75.0617443");

      // Filters
      const [search, setSearch] = useState("");
      const [actCategory, setActCategory] = useState("All");
      const [actTransit, setActTransit] = useState("All");

      const [restDistanceCat, setRestDistanceCat] = useState("All");
      const [restFoodType, setRestFoodType] = useState("All");
      const [restExpenseLevel, setRestExpenseLevel] = useState("All");
      const [restBeenBefore, setRestBeenBefore] = useState("All");
      const [restReservations, setRestReservations] = useState("All");
      const [restView, setRestView] = useState("All");

      // Sorting
      const [sortCol, setSortCol] = useState("distance");
      const [sortDir, setSortDir] = useState("asc");

      // Dynamically calculate Haversine distances based on current Home base
      const activitiesWithDist = useMemo(() => {
        return window.ACTIVITIES_DATA.map(a => {
          if (a.lat !== null && a.lng !== null) {
            const calc = getDistanceMiles(homeLocation.lat, homeLocation.lng, a.lat, a.lng);
            return { ...a, calculatedDistance: calc };
          }
          return a;
        });
      }, [homeLocation]);

      const restaurantsWithDist = useMemo(() => {
        return window.RESTAURANTS_DATA.map(r => {
          if (r.lat !== null && r.lng !== null) {
            const calc = getDistanceMiles(homeLocation.lat, homeLocation.lng, r.lat, r.lng);
            return { ...r, calculatedDistance: calc };
          }
          return r;
        });
      }, [homeLocation]);

      // Unique filter arrays
      const categories = useMemo(() => {
        return Array.from(new Set(activitiesWithDist.map(a => a.category).filter(Boolean))).sort();
      }, [activitiesWithDist]);

      const foodTypes = useMemo(() => {
        return Array.from(new Set(restaurantsWithDist.map(r => r.foodType).filter(t => t && t !== "Other"))).sort();
      }, [restaurantsWithDist]);

      const expenseLevels = useMemo(() => {
        return Array.from(new Set(restaurantsWithDist.map(r => r.filterLevel || r.level).filter(l => l && l !== "Other"))).sort();
      }, [restaurantsWithDist]);

      const viewCategories = useMemo(() => {
        return Array.from(new Set(restaurantsWithDist.map(r => r.view).filter(Boolean))).sort();
      }, [restaurantsWithDist]);

      // Filter applications
      const filteredActivities = useMemo(() => {
        let list = [...activitiesWithDist];
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          list = list.filter(a => a.name.toLowerCase().includes(q) || a.what.toLowerCase().includes(q) || a.notes.toLowerCase().includes(q));
        }
        if (actCategory !== "All") list = list.filter(a => a.category === actCategory);
        if (actTransit !== "Yes") list = list.filter(a => a.reachableByTransit);
        else if (actTransit !== "No") list = list.filter(a => !a.reachableByTransit);

        if (sortCol) {
          list.sort((a, b) => {
            let av = 0, bv = 0;
            if (sortCol === "name") { av = a.name; bv = b.name; }
            else if (sortCol === "distance") { av = a.calculatedDistance ?? a.distanceVal ?? 999; bv = b.calculatedDistance ?? b.distanceVal ?? 999; }
            else if (sortCol === "category") { av = a.category; bv = b.category; }

            if (typeof av === "number") return sortDir === "asc" ? av - bv : bv - av;
            return sortDir === "asc" ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
          });
        }
        return list;
      }, [activitiesWithDist, search, actCategory, actTransit, sortCol, sortDir]);

      const filteredRestaurants = useMemo(() => {
        let list = [...restaurantsWithDist];
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          list = list.filter(r => r.restaurant.toLowerCase().includes(q) || r.generalType.toLowerCase().includes(q) || r.notes.toLowerCase().includes(q));
        }
        if (restDistanceCat !== "All") list = list.filter(r => r.distanceCategory === restDistanceCat);
        if (restFoodType !== "All") list = list.filter(r => r.foodType === restFoodType);
        if (restExpenseLevel !== "All") list = list.filter(r => (r.filterLevel || r.level) === restExpenseLevel);
        if (restBeenBefore === "Yes") list = list.filter(r => r.beenBefore);
        else if (restBeenBefore === "No") list = list.filter(r => !r.beenBefore);
        if (restReservations === "Yes") list = list.filter(r => r.reservations && r.reservations !== "");
        else if (restReservations === "No") list = list.filter(r => !r.reservations || r.reservations === "");
        if (restView !== "All") list = list.filter(r => r.view === restView);

        if (sortCol) {
          list.sort((a, b) => {
            let av = 0, bv = 0;
            if (sortCol === "restaurant") { av = a.restaurant; bv = b.restaurant; }
            else if (sortCol === "distance") { av = a.calculatedDistance ?? a.distanceVal ?? 999; bv = b.calculatedDistance ?? b.distanceVal ?? 999; }
            else if (sortCol === "foodType") { av = a.generalType; bv = b.generalType; }
            else if (sortCol === "level") { av = a.level; bv = b.level; }

            if (typeof av === "number") return sortDir === "asc" ? av - bv : bv - av;
            return sortDir === "asc" ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
          });
        }
        return list;
      }, [restaurantsWithDist, search, restDistanceCat, restFoodType, restExpenseLevel, restBeenBefore, restReservations, restView, sortCol, sortDir]);

      function handleTabChange(tab) {
        setActiveTab(tab);
        setSearch("");
        setSortCol("distance");
        setSortDir("asc");
        
        setActCategory("All");
        setActTransit("All");
        setRestDistanceCat("All");
        setRestFoodType("All");
        setRestExpenseLevel("All");
        setRestBeenBefore("All");
        setRestReservations("All");
        setRestView("All");
      }

      function handleSort(col) {
        if (sortCol === col) {
          setSortDir(sortDir === "asc" ? "desc" : "asc");
        } else {
          setSortCol(col);
          setSortDir("asc");
        }
      }

      function applyCustomHome() {
        const lat = parseFloat(customLat);
        const lng = parseFloat(customLng);
        if (!isNaN(lat) && !isNaN(lng)) {
          setHomeLocation({ name: customName || "Custom Location", lat, lng });
          setIsSettingsOpen(false);
        } else {
          alert("Invalid decimal coordinates.");
        }
      }

      const hasFilters = search || actCategory !== "All" || actTransit !== "All" || restDistanceCat !== "All" || restFoodType !== "All" || restExpenseLevel !== "All" || restBeenBefore !== "All" || restReservations !== "All" || restView !== "All";

      return (
        <div className="min-h-screen bg-background text-foreground flex flex-col">
          {/* Header */}
          <div className="relative border-b-2 border-primary/15 bg-gradient-to-r from-[#0077b6] via-[#00b4d8] to-[#48cae4] py-5 shadow text-white">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-1.5 text-white/90 text-[10px] font-black tracking-wider uppercase mb-0.5">🌊 Beach Breakdown Vacation Guide</div>
                <h1 className="text-2xl sm:text-3xl font-heading font-black tracking-tight drop-shadow-sm">Ocean City 2026</h1>
                <p className="text-xs text-white/90 mt-1 font-semibold">
                  🏠 Home Base: <span className="underline decoration-accent decoration-2 font-bold">{homeLocation.name}</span>
                </p>
              </div>
              
              <div className="flex flex-wrap items-center gap-2">
                <div className="bg-white/10 p-0.5 rounded-full flex gap-0.5 border border-white/20">
                  <button onClick={() => setViewMode("table")} className={`px-3 py-1 rounded-full text-xs font-black transition-all ${viewMode === "table" ? "bg-white text-foreground" : "text-white hover:bg-white/10"}`}>Table</button>
                  <button onClick={() => setViewMode("easyread")} className={`px-3 py-1 rounded-full text-xs font-black transition-all ${viewMode === "easyread" ? "bg-white text-foreground" : "text-white hover:bg-white/10"}`}>Easy Read</button>
                </div>
                <button onClick={() => setIsSettingsOpen(true)} className="flex items-center gap-1 bg-white/20 hover:bg-white/30 border border-white/20 rounded-full px-3 py-1.5 text-xs font-black text-white"><IconSettings /> Settings</button>
                <button onClick={() => setIsMapOpen(true)} className="flex items-center gap-1.5 bg-accent hover:bg-[#e7914f] rounded-full px-4 py-1.5 text-xs font-black text-white shadow-md transition-all active:scale-[0.98]"><IconMap /> View Map</button>
              </div>
            </div>
          </div>

          {/* Navigation tabs */}
          <div className="bg-[#1b3a4b] sticky top-0 z-30 shadow-sm border-b border-primary/10">
            <div className="max-w-7xl mx-auto px-4 flex">
              <button onClick={() => handleTabChange("activities")} className={`py-3.5 px-5 text-sm font-extrabold border-b-4 ${activeTab === "activities" ? "text-white border-accent" : "text-white/60 hover:text-white border-transparent"}`}>🎡 Activities</button>
              <button onClick={() => handleTabChange("restaurants")} className={`py-3.5 px-5 text-sm font-extrabold border-b-4 ${activeTab === "restaurants" ? "text-white border-accent" : "text-white/60 hover:text-white border-transparent"}`}>🍔 Restaurants</button>
            </div>
          </div>

          {/* Filters controls */}
          <div className="bg-[#fef9ec] border-b border-primary/10 py-3">
            <div className="max-w-7xl mx-auto px-4 flex flex-wrap items-center gap-2">
              <div className="relative flex-1 min-w-[200px] max-w-xs">
                <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-primary opacity-65"><IconSearch /></span>
                <input type="text" placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-8 pr-2.5 py-1.5 text-xs rounded-full border border-primary/20 bg-white text-foreground focus:outline-none focus:ring-1 focus:ring-primary" />
              </div>

              {activeTab === "activities" ? (
                <>
                  <select value={actCategory} onChange={e => setActCategory(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">All Categories</option>
                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <select value={actTransit} onChange={e => setActTransit(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">All Transit</option>
                    <option value="Yes">✓ Public Transport</option>
                    <option value="No">✗ Needs Ride</option>
                  </select>
                </>
              ) : (
                <>
                  <select value={restDistanceCat} onChange={e => setRestDistanceCat(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">All Distances</option>
                    <option value="Walkable">Walkable</option>
                    <option value="Drive">Drive</option>
                    <option value="Longer Trip">Longer Trip</option>
                  </select>
                  <select value={restFoodType} onChange={e => setRestFoodType(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">All Foods</option>
                    {foodTypes.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                  <select value={restExpenseLevel} onChange={e => setRestExpenseLevel(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">All Expenses</option>
                    {expenseLevels.map(l => <option key={l} value={l}>{l}</option>)}
                  </select>
                  <select value={restBeenBefore} onChange={e => setRestBeenBefore(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">Been Before (All)</option>
                    <option value="Yes">Been Before: Yes</option>
                    <option value="No">Been Before: No</option>
                  </select>
                  <select value={restReservations} onChange={e => setRestReservations(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">Reservations (All)</option>
                    <option value="Yes">Reservations: Yes</option>
                    <option value="No">Reservations: No</option>
                  </select>
                  <select value={restView} onChange={e => setRestView(e.target.value)} className="text-[11px] font-bold rounded-full border border-primary/20 bg-white text-foreground px-3 py-1.5">
                    <option value="All">Any View</option>
                    {viewCategories.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                </>
              )}

              {hasFilters && (
                <button onClick={clearAllFilters} className="flex items-center gap-1 text-[11px] font-black text-white bg-primary hover:bg-[#007b85] rounded-full px-3 py-1.5 shadow-sm"><IconX /> Clear</button>
              )}
            </div>
          </div>

          {/* Core Content */}
          <div className="flex-1 max-w-7xl mx-auto w-full px-4 py-4">
            <div className="flex items-center justify-between mb-3 text-[10px] font-bold text-[#5e7e8a]">
              <div>Showing {activeTab === "activities" ? filteredActivities.length : filteredRestaurants.length} matches</div>
              <div>📍 Distances calculated from Home Base</div>
            </div>

            {viewMode === "easyread" ? (
              <EasyRead 
                activeTab={activeTab} 
                activities={filteredActivities} 
                restaurants={filteredRestaurants} 
                onOpenMenu={(url, name) => setActiveMenu({ url, name })}
                onOpenMap={() => setIsMapOpen(true)} 
              />
            ) : (
              <div className="bg-white rounded-3xl border border-primary/10 shadow-sm overflow-hidden overflow-x-auto">
                {activeTab === "activities" ? (
                  <table className="w-full border-collapse" style={{ minWidth: 920 }}>
                    <thead>
                      <tr className="bg-[#d4eeef]/40">
                        <th onClick={() => handleSort("name")} className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase cursor-pointer hover:text-foreground">Name</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Address</th>
                        <th onClick={() => handleSort("distance")} className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase cursor-pointer hover:text-foreground">Distance</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Transport Info</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">What</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Transit?</th>
                        <th onClick={() => handleSort("category")} className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase cursor-pointer hover:text-foreground">Category</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Hours</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Notes</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Web</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredActivities.length === 0 ? (
                        <tr><td colSpan={10} className="px-3 py-10 text-center text-[#5e7e8a] font-bold">🏖️ No activities found.</td></tr>
                      ) : (
                        filteredActivities.map((a, idx) => {
                          const displayDist = a.calculatedDistance !== undefined ? formatDistance(a.calculatedDistance) : a.distance;
                          return (
                            <tr key={a.id} className={`border-b border-primary/5 last:border-0 hover:bg-[#d4eeef]/20 ${idx % 2 === 0 ? "bg-white" : "bg-[#fef9ec]/20"}`}>
                              <td className="px-3 py-2.5 text-xs font-bold">{a.name}</td>
                              <td className="px-3 py-2.5 text-xs text-[#5e7e8a] max-w-[120px] truncate" title={a.address}>{a.address}</td>
                              <td className="px-3 py-2.5 text-xs font-mono font-bold text-[#0077b6]">{displayDist}</td>
                              <td className="px-3 py-2.5 text-xs text-muted-foreground max-w-[150px]">{a.transitDetail}</td>
                              <td className="px-3 py-2.5 text-xs max-w-[180px]">{a.what}</td>
                              <td className="px-3 py-2.5 text-xs">
                                {a.reachableByTransit ? (
                                  <span className="px-2 py-0.5 text-[10px] font-bold rounded-full bg-[#d4eeef] text-[#0096a0]">Yes</span>
                                ) : (
                                  <span className="px-2 py-0.5 text-[10px] font-bold rounded-full bg-gray-100 text-gray-500">No</span>
                                )}
                              </td>
                              <td className="px-3 py-2.5 text-xs"><span className="px-2 py-0.5 text-[10px] font-bold bg-[#fdefc8] text-[#7a4f00] rounded-full">{a.category}</span></td>
                              <td className="px-3 py-2.5 text-[10px] font-mono whitespace-pre-line leading-tight">{a.hours}</td>
                              <td className="px-3 py-2.5 text-xs max-w-[200px] text-muted-foreground">{a.notes}</td>
                              <td className="px-3 py-2.5 text-xs">
                                {a.url ? <a href={a.url} target="_blank" rel="noopener noreferrer" className="text-primary hover:underline font-bold">Link</a> : "-"}
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                ) : (
                  <table className="w-full border-collapse" style={{ minWidth: 1020 }}>
                    <thead>
                      <tr className="bg-[#d4eeef]/40">
                        <th onClick={() => handleSort("restaurant")} className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase cursor-pointer hover:text-foreground">Restaurant</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Address</th>
                        <th onClick={() => handleSort("distance")} className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase cursor-pointer hover:text-foreground">Distance</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Type</th>
                        <th onClick={() => handleSort("level")} className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase cursor-pointer hover:text-foreground">Level</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Been Before?</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Reservations?</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">View</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Hours</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Notes</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Menu</th>
                        <th className="px-3 py-2 text-left text-xs font-bold text-muted-foreground uppercase">Website</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredRestaurants.length === 0 ? (
                        <tr><td colSpan={12} className="px-3 py-10 text-center text-[#5e7e8a] font-bold">🏖️ No restaurants found.</td></tr>
                      ) : (
                        filteredRestaurants.map((r, idx) => {
                          const displayDist = r.calculatedDistance !== undefined ? formatDistance(r.calculatedDistance) : r.distance;
                          return (
                            <tr key={r.id} className={`border-b border-primary/5 last:border-0 hover:bg-[#d4eeef]/20 ${idx % 2 === 0 ? "bg-white" : "bg-[#fef9ec]/20"}`}>
                              <td className="px-3 py-2.5 text-xs font-bold">{r.restaurant}</td>
                              <td className="px-3 py-2.5 text-xs text-[#5e7e8a] max-w-[120px] truncate" title={r.address}>{r.address}</td>
                              <td className="px-3 py-2.5 text-xs font-mono font-bold text-[#0077b6]">{displayDist}</td>
                              <td className="px-3 py-2.5 text-xs text-muted-foreground">{r.generalType}</td>
                              <td className="px-3 py-2.5 text-xs"><span className="px-2 py-0.5 text-[10px] font-bold bg-[#fdefc8] text-[#7a4f00] rounded-full">{r.filterLevel || r.level}</span></td>
                              <td className="px-3 py-2.5 text-xs">
                                {r.beenBefore ? (
                                  <span className="px-2 py-0.5 text-[10px] font-bold rounded-full bg-[#d4eeef] text-[#0096a0]">Yes</span>
                                ) : (
                                  <span className="px-2 py-0.5 text-[10px] font-bold rounded-full bg-gray-100 text-gray-500">No</span>
                                )}
                              </td>
                              <td className="px-3 py-2.5 text-xs text-muted-foreground">{r.reservations || "-"}</td>
                              <td className="px-3 py-2.5 text-xs text-muted-foreground">{r.view || "-"}</td>
                              <td className="px-3 py-2.5 text-[10px] font-mono whitespace-pre-line leading-tight">{r.hours || "-"}</td>
                              <td className="px-3 py-2.5 text-xs max-w-[180px] text-muted-foreground">{r.notes}</td>
                              <td className="px-3 py-2.5 text-xs">
                                {r.menu ? <button onClick={() => setActiveMenu({ url: r.menu, name: r.restaurant })} className="px-2 py-0.5 text-[10px] font-black text-white bg-primary rounded-full">Menu</button> : "-"}
                              </td>
                              <td className="px-3 py-2.5 text-xs">
                                {r.websiteUrl ? <a href={r.websiteUrl} target="_blank" rel="noopener noreferrer" className="text-primary hover:underline font-bold">Link</a> : "-"}
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                )}
              </div>
            )}
          </div>

          {/* Settings Modal */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="relative w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl border border-primary/20">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-base font-heading font-black">Configure Home Location</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="p-1 text-muted-foreground"><IconX /></button>
                </div>
                
                <p className="text-[10px] text-muted-foreground mb-3 leading-relaxed">Adjust distance reference point. Select a preset or type custom coordinates.</p>

                <div className="mb-3">
                  <label className="block text-[9px] font-bold uppercase tracking-wider text-[#5e7e8a] mb-1">Preset Hotspots</label>
                  <select 
                    onChange={e => {
                      const preset = HOME_PRESETS[parseInt(e.target.value)];
                      if (preset) {
                        setHomeLocation(preset);
                        setCustomName(preset.name);
                        setCustomLat(String(preset.lat));
                        setCustomLng(String(preset.lng));
                      }
                    }}
                    className="w-full text-xs font-semibold rounded-xl border border-primary/20 px-3 py-2 bg-white"
                  >
                    <option value="">-- Choose a Preset Spot --</option>
                    {HOME_PRESETS.map((p, idx) => <option key={p.name} value={idx}>{p.name}</option>)}
                  </select>
                </div>

                <div className="border-t border-gray-100 pt-3 mt-3">
                  <span className="block text-[10px] font-black uppercase text-foreground mb-2">Or Use Custom Coordinates</span>
                  
                  <div className="mb-2">
                    <label className="block text-[9px] font-bold text-muted-foreground mb-0.5">Spot Name</label>
                    <input type="text" value={customName} onChange={e => setCustomName(e.target.value)} className="w-full text-xs font-semibold rounded-xl border border-primary/20 px-3 py-1.5" />
                  </div>

                  <div className="grid grid-cols-2 gap-2 mb-3">
                    <div>
                      <label className="block text-[9px] font-bold text-muted-foreground mb-0.5">Latitude</label>
                      <input type="text" value={customLat} onChange={e => setCustomLat(e.target.value)} className="w-full text-xs font-mono rounded-xl border border-primary/20 px-3 py-1.5" />
                    </div>
                    <div>
                      <label className="block text-[9px] font-bold text-muted-foreground mb-0.5">Longitude</label>
                      <input type="text" value={customLng} onChange={e => setCustomLng(e.target.value)} className="w-full text-xs font-mono rounded-xl border border-primary/20 px-3 py-1.5" />
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button onClick={applyCustomHome} className="flex-1 bg-primary text-white text-xs font-black py-2.5 rounded-xl hover:bg-[#007b85]">Apply</button>
                    <button onClick={() => setIsSettingsOpen(false)} className="flex-1 bg-gray-100 text-foreground text-xs font-black py-2.5 rounded-xl">Cancel</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Map Overlay Modal */}
          {isMapOpen && (
            <MapView 
              activeTab={activeTab} 
              activities={filteredActivities} 
              restaurants={filteredRestaurants} 
              home={homeLocation} 
              onClose={() => setIsMapOpen(false)}
              onSelectRestaurant={r => {
                setIsMapOpen(false);
                if (r.menu) setActiveMenu({ url: r.menu, name: r.restaurant });
              }}
            />
          )}

          {/* Menu Modal */}
          {activeMenu && (
            <MenuModal 
              menuUrl={activeMenu.url} 
              restaurantName={activeMenu.name} 
              onClose={() => setActiveMenu(null)} 
            />
          )}

          {/* Footer */}
          <div className="bg-[#1b3a4b] text-white/50 text-[10px] text-center py-4 border-t border-white/5 mt-auto">
            <p className="font-semibold">⛱️ Built for Casey & Family — Vacation Ocean City, MD</p>
            <p className="mt-0.5">Works 100% offline. Pre-geocoded coordinates matching Google My Maps.</p>
          </div>
        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
